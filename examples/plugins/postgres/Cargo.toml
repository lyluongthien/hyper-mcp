[package]
name = "postgres-plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
postgres-protocol = "0.6"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
extism-pdk = "1.0"
base64-serde = "0.7"
base64 = "0.21"
wasi-preview2 = { git = "https://github.com/bytecodealliance/preview2-prototyping", rev = "main" }
wasi-cap-std-sync = { git = "https://github.com/bytecodealliance/preview2-prototyping", rev = "main" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
testcontainers = "0.14"
pretty_assertions = "1.0"
mockall = "0.11"
lazy_static = "1.4"

[build-dependencies]
